name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS on macOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create or sync iOS project
        id: ios_project
        shell: bash
        run: |
          if [ -d ios/App ]; then
            npx cap sync ios
          else
            npx cap add ios --packagemanager SPM
            npx cap sync ios
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload native iOS project
        if: ${{ always() && steps.ios_project.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-project
          path: |
            ios/
            !ios/App/App/public/**
            !ios/App/App/DerivedData/**
            !ios/App/Pods/**
          include-hidden-files: true
          if-no-files-found: error
